<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente vibrante estilo One UI (Laranja -> Coral/Rosa -> Roxo/Magenta) -->
    <linearGradient id="oneUiBg" x1="8%" y1="6%" x2="92%" y2="94%">
      <stop offset="0%" stop-color="#FF8524" />
      <stop offset="48%" stop-color="#F6416C" />
      <stop offset="100%" stop-color="#9B1FE8" />
    </linearGradient>

    <!-- Brilho superior curvo (Glossy 3D One UI) -->
    <linearGradient id="topGloss" x1="20%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sombra suave por baixo do ícone branco -->
    <filter id="dropShadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#3B0764" flood-opacity="0.42" />
    </filter>

    <!-- Gradiente Azul/Turquesa para o detalhe central e rodas -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <clipPath id="squircleClip">
      <path d="M 256,16 C 396,16 496,116 496,256 C 496,396 396,496 256,496 C 116,496 16,396 16,256 C 16,116 116,16 256,16 Z" />
    </clipPath>
  </defs>

  <!-- Fundo Squircle One UI -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#oneUiBg)" />

    <!-- Reflexo de vidro curvo na metade superior (idêntico ao estilo Abastece) -->
    <path
      d="M -20,0 L 532,0 L 532,215 Q 256,155 -20,235 Z"
      fill="url(#topGloss)"
    />

    <!-- Borda interna 3D luminosa no topo -->
    <path
      d="M 256,20 C 393,20 492,119 492,256 C 492,393 393,492 256,492 C 119,492 20,393 20,256 C 20,119 119,20 256,20 Z"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="6"
      stroke-opacity="0.28"
    />
  </g>

  <!-- Sombra na base -->
  <ellipse cx="262" cy="408" rx="128" ry="18" fill="#4A044E" opacity="0.32" />

  <!-- Ícone Central Branco 3D: Carrinho de Supermercado + Visor Digital € -->
  <g filter="url(#dropShadow)">
    <!-- Pega esquerda do carrinho -->
    <path
      d="M 88,150 H 134 C 145,150 152,157 155,168 L 192,324 C 195,336 205,344 218,344 H 366"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Corpo branco sólido do Carrinho / Talão com visor digital (estilo Abastece) -->
    <rect x="164" y="124" width="224" height="196" rx="38" fill="#FFFFFF" />
    <rect x="164" y="286" width="224" height="34" rx="14" fill="#E2E8F0" />

    <!-- Visor Digital Escuro com Preço em Euros e Itens -->
    <rect x="190" y="148" width="172" height="74" rx="18" fill="#0B132B" />
    <text
      x="276"
      y="186"
      text-anchor="middle"
      fill="#38BDF8"
      font-family="monospace, sans-serif"
      font-size="30"
      font-weight="900"
      letter-spacing="1"
    >
      € 34.80
    </text>
    <text
      x="276"
      y="210"
      text-anchor="middle"
      fill="#4ADE80"
      font-family="monospace, sans-serif"
      font-size="16"
      font-weight="800"
      letter-spacing="1.5"
    >
      14 ARTIGOS
    </text>

    <!-- Emblema Azul/Turquesa de Compras no centro do corpo branco -->
    <circle cx="276" cy="262" r="28" fill="url(#cyanAccent)" />
    <path
      d="M 263,262 L 272,271 L 291,252"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Base inferior do carrinho -->
    <rect x="150" y="336" width="244" height="24" rx="12" fill="#F1F5F9" />

    <!-- Rodas do Carrinho -->
    <circle cx="204" cy="388" r="26" fill="#FFFFFF" />
    <circle cx="204" cy="388" r="13" fill="url(#cyanAccent)" />

    <circle cx="344" cy="388" r="26" fill="#FFFFFF" />
    <circle cx="344" cy="388" r="13" fill="url(#cyanAccent)" />
  </g>
</svg>
